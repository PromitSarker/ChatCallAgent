version: "3.8"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./uploads:/app/uploads
    env_file:
      - .env # This will load GROQ_API_KEY
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3103:3000"
    restart: unless-stopped
    depends_on:
      - api

  admin-frontend:
    build: ./admin-frontend
    ports:
      - "3001:3001"
    restart: unless-stopped
    depends_on:
      - api
